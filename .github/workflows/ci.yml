name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked --group dev --extra service
      - name: Check package import
        run: uv run python -c "import clinical_nlp_course, miopia_nlp"
      - name: Lint
        run: |
          uv run ruff check src tests scripts curso tutorial main.py
          uv run ruff format --check src tests scripts curso tutorial main.py
      - name: Unit tests and coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=75
      - name: Verify generated notebooks
        run: |
          uv run python scripts/generate_advanced_synthetic_data.py
          uv run python tutorial/build_tutorial.py
          uv run python curso/build_course.py
          git diff --exit-code -- '*.ipynb' data/renal_classification_synthetic.jsonl
      - name: Execute tutorial
        run: uv run python tutorial/validate_tutorial.py
      - name: Execute CPU course path
        run: uv run python curso/validate_course.py
      - name: Build package
        run: uv build
      - name: Build production image
        run: docker build -t miopia-nlp:ci .
